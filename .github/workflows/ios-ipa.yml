name: iOS IPA

# Builds an unsigned WealthFlow.ipa for sideloading (SideStore / 3uTools /
# Sideloadly sign it with your own Apple ID) and publishes it as a GitHub
# release together with altstore.json, the SideStore source:
#   https://github.com/Shehandiluka/wealthflow/releases/latest/download/altstore.json
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - index.html
      - package.json
      - capacitor.config.ts
      - resources/**
      - .github/workflows/ios-ipa.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Create iOS project
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios --assetPath resources
          npx cap sync ios

      - name: App version
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.${{ github.run_number }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true

      - name: Build (unsigned)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out" && zip -qry WealthFlow.ipa Payload
          ls -l WealthFlow.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WealthFlow-ipa
          path: ${{ runner.temp }}/out/WealthFlow.ipa

      - name: SideStore / AltStore source
        env:
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/out"
          git -C "$GITHUB_WORKSPACE" log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' | sed '/^\s*$/d' > notes.txt
          python3 - <<'PY'
          import json, os, datetime
          run, repo = os.environ["RUN"], os.environ["REPO"]
          ver = f"1.0.{run}"
          tag = f"v{ver}"
          ipa = f"https://github.com/{repo}/releases/download/{tag}/WealthFlow.ipa"
          icon = f"https://raw.githubusercontent.com/{repo}/main/resources/icon.png"
          size = os.path.getsize("WealthFlow.ipa")
          notes = "\n".join(l.strip() for l in open("notes.txt") if l.strip())
          now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          src = {
            "name": "WealthFlow", "identifier": "com.swiftlk.wealthflow.source",
            "subtitle": "Money manager by Swift", "iconURL": icon, "website": "https://swiftlk.com",
            "tintColor": "1FC7A5",
            "apps": [{
              "name": "WealthFlow", "bundleIdentifier": "com.swiftlk.wealthflow",
              "developerName": "SwiftPayPOS (Private) Limited",
              "subtitle": "Wallets, budgets, debts and Telegram entry",
              "localizedDescription": "Personal money manager: wallets in many currencies, budgets, debts, pay later, lend & borrow, investments, trips and reports.",
              "iconURL": icon, "tintColor": "1FC7A5", "category": "utilities",
              "versions": [{"version": ver, "buildVersion": run, "date": now, "localizedDescription": notes,
                            "downloadURL": ipa, "size": size, "minOSVersion": "14.0"}],
              "appPermissions": {"entitlements": [], "privacy": {}},
            }],
            "news": [],
          }
          json.dump(src, open("altstore.json", "w"), ensure_ascii=False, indent=1)
          open(os.environ["GITHUB_ENV"], "a").write(f"TAG={tag}\n")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/out"
          gh release create "$TAG" WealthFlow.ipa altstore.json \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "WealthFlow $TAG" --notes-file notes.txt --latest
